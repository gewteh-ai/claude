<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PrawnStar — QR Code (Scan to Play)</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  body { margin:0; background:#071a24; color:#eaf9ff; font-family:"Trebuchet MS",Arial,sans-serif; text-align:center; padding:20px; }
  h1 { color:#38e0ff; }
  p { opacity:.85; max-width:560px; margin:8px auto; line-height:1.5; }
  canvas { border-radius:14px; max-width:92vw; height:auto; box-shadow:0 12px 40px rgba(0,0,0,.5); margin-top:18px; }
  .err { color:#ff8a8a; margin-top:20px; }
  button { margin-top:22px; background:linear-gradient(90deg,#ffd83a,#ff9a2d); color:#04202e; border:none; border-radius:24px; padding:14px 34px; font-weight:800; font-size:17px; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  code { background:#0a2735; padding:3px 8px; border-radius:6px; color:#8fe8ff; }
</style>
</head>
<body>
  <h1>🦐⭐ PrawnStar — Scan to Play</h1>
  <p>This QR code opens the game at <code>gewteh-ai.github.io/claude</code>. Anyone who scans it plays instantly — great for posters, social videos, or showing friends in person.</p>
  <div id="holder"></div>
  <div><button id="dl" style="display:none" onclick="download()">⬇ Download QR image</button></div>

<script>
const GAME_URL = "https://gewteh-ai.github.io/claude/";
const holder = document.getElementById("holder");
const canvas = document.createElement("canvas");

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawCard(qrImg) {
  const c = canvas.getContext("2d");
  const W = 620, H = 780; canvas.width = W; canvas.height = H;
  const bg = c.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0c5470"); bg.addColorStop(0.6, "#063246"); bg.addColorStop(1, "#02121d");
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  // title
  c.textAlign = "center"; c.textBaseline = "alphabetic";
  c.font = "800 50px 'Trebuchet MS', Arial, sans-serif";
  c.fillStyle = "#eaf9ff"; c.fillText("PrawnStar 🦐⭐", W / 2, 78);
  // white QR panel
  const qs = 400, qx = (W - qs) / 2, qy = 120;
  c.fillStyle = "#ffffff"; roundRect(c, qx - 22, qy - 22, qs + 44, qs + 44, 26); c.fill();
  c.imageSmoothingEnabled = false;
  c.drawImage(qrImg, qx, qy, qs, qs);
  // caption
  c.fillStyle = "#ffd83a"; c.font = "800 40px 'Trebuchet MS', Arial, sans-serif";
  c.fillText("SCAN TO PLAY!", W / 2, qy + qs + 90);
  c.fillStyle = "#bfe6ff"; c.font = "24px 'Trebuchet MS', Arial, sans-serif";
  c.fillText("gewteh-ai.github.io/claude", W / 2, qy + qs + 130);
  holder.appendChild(canvas);
  document.getElementById("dl").style.display = "inline-block";
}

function download() {
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "prawnstar-qr.png";
  document.body.appendChild(a); a.click(); a.remove();
}

try {
  if (typeof qrcode === "undefined") throw new Error("QR library failed to load");
  const qr = qrcode(0, "M");
  qr.addData(GAME_URL);
  qr.make();
  const img = new Image();
  img.onload = () => drawCard(img);
  img.src = qr.createDataURL(10, 2);   // cellSize, margin -> data URL (same-origin, safe to draw)
} catch (e) {
  const d = document.createElement("div");
  d.className = "err";
  d.innerHTML = "Couldn't load the QR generator (network blocked?).<br>You can make one free at any QR site using this link:<br><code>" + GAME_URL + "</code>";
  holder.appendChild(d);
}
</script>
</body>
</html>
